name: ci

# CI runs lint + the unit tests ONLY. It must never run a real benchmark —
# that invokes `claude` / `codex` and pagehub-evals, costs tokens, and needs
# secrets. The codex adapter is tested against recorded `codex exec --json`
# fixtures under tests/fixtures/.
# The runner is exercised here through FakeHarness / FakeGrader.

# A pull request's CI starts when the review script adds the `0C/0I` label, not on every push,
# and runs once on the reviewed commit (skill-sdlc "CI runs after review", Gavin 13 Oct 2026).
# Each job skips a pull_request event unless it is the `0C/0I` label; push and dispatch are not gated.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.label.name == '0C/0I'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
