name: eval-chess-frontend-with-fixture-via-openai
description: >-
  Cross-provider sibling of eval-chess-frontend-with-fixture. Same target
  repo, same grader, same prompt (the {{ grader_fixture }}-injecting one),
  same max_attempts — only the harness routing differs: claude-code is
  pointed at pagehub-llm-gateway via ANTHROPIC_BASE_URL, and the model id
  is an OpenAI GPT-5 family one that the gateway translates upstream.
  Paired with eval-chess-frontend-with-fixture.yaml under the
  cross-model-comparison theory.

target_repo: git@github.com:pagehub-io/eval-chess-frontend.git
target_start: empty
build_prompt_file: prompts/eval-chess-frontend-with-fixture.md

grader:
  # Identical to eval-chess-frontend-with-fixture — the grader has no idea
  # which model wrote the code under test.
  evals_base_url: http://localhost:8002
  fixture_bundle: fixtures/eval-chess-frontend.json
  collection: eval-chess-frontend
  env:
    eval-chess-frontend_url: http://host.docker.internal:8004
    pagehub-browser_url:     http://host.docker.internal:4010

max_attempts: 5

# One run. Frontier OpenAI reasoning model that the current
# pagehub-llm-gateway can actually reach: gpt-5.5 (released 2026-04-23). The
# pro tier (gpt-5.5-pro / gpt-5-pro) is not currently routable — those
# models are served by OpenAI's /v1/responses endpoint, and the gateway
# only speaks /v1/chat/completions (see api/providers/openai_compatible.py
# in pagehub-llm-gateway). Switching back to a pro id is a one-line YAML
# change once the gateway grows /v1/responses support.
#
# The `gateway` block tells the claude-code harness to set
# ANTHROPIC_BASE_URL=<url> and ANTHROPIC_AUTH_TOKEN=$<auth_token_env> in the
# subprocess env. The model id is passed through verbatim to `claude -p`;
# pagehub-llm-gateway routes by prefix (gpt-* -> OpenAI). The token VALUE
# is read from the runner's process env at dispatch — never recorded.
harnesses:
  - harness: claude-code
    model: gpt-5.5
    config:
      gateway:
        url: http://localhost:4011
        auth_token_env: GATEWAY_AUTH_TOKEN
