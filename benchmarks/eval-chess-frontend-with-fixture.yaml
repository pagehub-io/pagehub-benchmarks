name: eval-chess-frontend-with-fixture
description: >-
  Treatment variant of eval-chess-frontend that injects the grader fixture
  bundle directly into the build prompt (via {{ grader_fixture }}). Same
  target repo, same grader, same harness matrix — only the build prompt
  differs. Paired with benchmarks/eval-chess-frontend.yaml under the
  eval-fixture-injection theory.

target_repo: git@github.com:pagehub-io/eval-chess-frontend.git
target_start: empty
build_prompt_file: prompts/eval-chess-frontend-with-fixture.md

grader:
  # The standalone pagehub-evals service (its docker-compose maps the API to
  # :8002). Same as eval-chess-frontend.
  evals_base_url: http://localhost:8002
  # Path within the pagehub-evals repo checkout (resolved relative to
  # PAGEHUB_EVALS_REPO, default ~/github/pagehub-io/pagehub-evals).
  fixture_bundle: fixtures/eval-chess-frontend.json
  collection: eval-chess-frontend
  env:
    # pagehub-evals fires HTTP from inside its own docker container, so
    # services on the HOST must be addressed via host.docker.internal —
    # both the headless-browser service AND the frontend it will drive.
    # The bundle's "chess-frontend-local" environment is PATCHed with these
    # values at grade time, so a run can repoint either at a worktree-local
    # deployment without editing the bundle.
    #
    # Order matters: the runner's readiness probe (`run.py::_health_url`)
    # picks the FIRST *_url here and waits for `<localhost>/health` to
    # answer. That MUST be the built service we're grading (port 8004),
    # NOT pagehub-browser (already up on :4010 → would short-circuit the
    # probe and start grading before `make up` is even ready).
    eval-chess-frontend_url: http://host.docker.internal:8004
    # The runner ALSO POSTs to pagehub-browser's /v1/admin/reset-sessions
    # before each attempt (kills the MAX_SESSIONS capacity cascade that
    # tanked the 2026-05-22 sweep — a leaked-sessions backlog from a prior
    # run / attempt 503s every subsequent /v1/sessions call). The Bearer
    # token comes from the runner's environment: PAGEHUB_BROWSER_ADMIN_TOKEN.
    # Unset → the call is skipped with a warning (no-op fallback so an
    # older pagehub-browser without the admin endpoint still works).
    pagehub-browser_url:     http://host.docker.internal:4010
  # Stronger readiness signal than the HTTP /health probe (Vite returns 200
  # the moment it binds, well before React hydrates). Before grading starts,
  # the runner polls pagehub-browser until [data-testid="board"] is visible
  # on the SUT. Without this, multiple models (Opus baseline attempt 1,
  # Sonnet 4.5/xhigh, gpt-5.5 attempt 1) hit a uniform 56-failure cascade of
  # testid-404s that looked like model failure but was actually first-paint
  # racing the grader's first request.
  ready_testid: board

max_attempts: 5

# The matrix: one run per entry. Rows 1–2 (native Anthropic, no gateway)
# back the eval-fixture-injection theory's baseline-vs-treatment comparison
# against eval-chess-frontend.yaml — the prompt is the only thing that
# varies between the two benchmarks. Rows 3+ route through
# pagehub-llm-gateway (Anthropic-API-compatible) at a non-Anthropic
# upstream; the model id passes through verbatim and the gateway routes
# by prefix (gpt-* -> OpenAI, grok-* -> xAI). The `gateway` block makes
# the claude-code harness export ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN
# into the `claude -p` subprocess env; the token value is read from the
# runner's process env at dispatch and never written to YAML or the run
# record. Cross-provider rows need the gateway service up locally (default
# :4011) with OPENAI_API_KEY / XAI_API_KEY in its env.
harnesses:
  - harness: claude-code
    model: claude-opus-4-7
    config:
      effort: xhigh
  - harness: claude-code
    model: claude-haiku-4-5
    config:
      effort: xhigh
  # Opus effort sweep — does effort level matter on the fixture-injecting prompt?
  # The baseline run (claude-opus-4-7 / xhigh on the original $15/$75 pricing)
  # PASSed on attempt 2. These rows test (a) older Opus generations at lower
  # effort levels, and (b) the half-version bumps. All four Opus 4.5+ models
  # share pricing ($5/$25), so cost deltas reflect token-usage deltas only.
  - harness: claude-code
    model: claude-opus-4-5
    config:
      effort: medium
  - harness: claude-code
    model: claude-opus-4-5
    config:
      effort: high
  - harness: claude-code
    model: claude-opus-4-6
    config:
      effort: high
  - harness: claude-code
    model: claude-opus-4-7
    config:
      effort: high
  # Sonnet 4.5 (with effort=xhigh -> extended thinking). Third-party agentic-coding
  # benchmarks score Grok 4.3 at roughly Sonnet 4.5 / thinking level, so this row
  # also serves as a *proxy* for what a Grok run would cost — multiply this run's
  # input_tokens by grok-4.3's $1.25/MTok and output_tokens by $2.50/MTok to get
  # a back-of-envelope Grok cost projection without spending xAI tokens.
  - harness: claude-code
    model: claude-sonnet-4-5
    config:
      effort: xhigh
  # Sonnet 4.6 at low effort. Counterpart to the sonnet-4-5/xhigh row: same
  # family, half-version newer, but explicitly LOW reasoning budget — the
  # closest the CLI exposes to "thinking off" (the CLI couples thinking to
  # effort, so `effort: low` is the proxy). Tests whether the fixture-injecting
  # prompt is enough on its own without heavy reasoning, and whether the
  # half-version bump from 4.5 → 4.6 compensates for the effort drop.
  - harness: claude-code
    model: claude-sonnet-4-6
    config:
      effort: low
  # Frontier OpenAI reasoning model the current gateway can actually reach.
  # Pro tier (gpt-5.5-pro / gpt-5-pro) needs OpenAI's /v1/responses endpoint
  # and the gateway only speaks /v1/chat/completions today — once that lands
  # in pagehub-llm-gateway this is a one-line swap to a pro id.
  - harness: claude-code
    model: gpt-5.5
    config:
      gateway:
        url: http://localhost:4011
        auth_token_env: GATEWAY_AUTH_TOKEN
