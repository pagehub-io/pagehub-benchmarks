# Per-model API pricing — USD per 1,000,000 tokens.
#
# `input` / `output` are the standard per-token rates (REQUIRED). `cache_write`
# is the prompt-cache write rate (Anthropic: 1.25x input over a 5-minute TTL).
# `cache_read` is the cache-hit read rate. For OpenAI models that publish only a
# "cached input" rate (the GPT-5 family) we record it under `cache_read` and
# leave `cache_write: 0` so a write contributes nothing. GPT-6 Astra publishes
# a separate "Cache writes" rate — see its entry.
#
# Providers without a prompt-cache concept (xAI / Grok) omit both cache fields
# (or set them to null). The loader treats missing/null cache rates as 0.0; the
# cost_usd computation in `runner.pricing` multiplies cache tokens by 0 and so
# adds nothing.
#
# `cost_usd` in a run record is recomputed from this table over the run's
# summed token counts — change a rate here, re-derive.
#
# To add a model: drop in a new key with the same fields (cache_* optional).

models:

  # --- Anthropic (claude-code's native subscription path, and the gateway's
  # "translate Anthropic protocol to <other>" upstreams). Published rates.

  # Opus 4.5 / 4.6 / 4.7 / 4.8 are all priced at the new $5 / $25 tier per
  # platform.claude.com/docs/en/docs/about-claude/pricing as of 2026-05.
  # (Opus 4.1 and earlier were the old $15 / $75 tier — deprecated.) Opus 4.7+
  # (incl. 4.8) use a new tokenizer that can use ~35% more tokens for the same
  # text, so cost_usd is not directly comparable to 4.6/4.5 on the same prompt.

  # Opus 4.8: published $5/$25 tier — confirmed 2026-05-28 at
  # platform.claude.com/docs/en/docs/about-claude/pricing (the "NextOpus" row +
  # the Managed-Agents worked example, which names "Claude Opus 4.8" at
  # $5/MTok input, $25/MTok output). Cache writes (5m) $6.25, cache reads $0.50.
  # Same rate table as 4.5/4.6/4.7; shares the 4.7+ tokenizer.
  claude-opus-4-8:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50

  claude-opus-4-7:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50

  claude-opus-4-6:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50

  claude-opus-4-5:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50

  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_write: 3.75
    cache_read: 0.30

  claude-sonnet-4-5:
    input: 3.00
    output: 15.00
    cache_write: 3.75
    cache_read: 0.30

  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10

  # --- OpenAI GPT-5 family — published rates as of 2026-05.
  # IDs match what `GET /v1/models` returns (verified at authoring time with
  # a real key). OpenAI's "cached input" is a discount on subsequent reads,
  # not a separate write charge; we record it under `cache_read` and leave
  # `cache_write` at 0.
  # gpt-5-pro has NO cached-input discount published — cache fields zero.

  gpt-5:
    input: 1.25
    output: 10.00
    cache_write: 0
    cache_read: 0.125

  gpt-5-pro:
    input: 15.00
    output: 120.00
    cache_write: 0
    cache_read: 0

  gpt-5-mini:
    input: 0.25
    output: 2.00
    cache_write: 0
    cache_read: 0.025

  gpt-5-nano:
    input: 0.05
    output: 0.40
    cache_write: 0
    cache_read: 0.005

  gpt-5-codex:
    input: 1.25
    output: 10.00
    cache_write: 0
    cache_read: 0.125

  # Current-generation GPT-5.5 (released 2026-04-23). Higher price, larger
  # context. gpt-5.5-pro has no cached-input discount.
  gpt-5.5:
    input: 5.00
    output: 30.00
    cache_write: 0
    cache_read: 0.50

  gpt-5.5-pro:
    input: 30.00
    output: 180.00
    cache_write: 0
    cache_read: 0

  # GPT-6 Astra — verified 2026-09-10 at
  # https://developers.openai.com/api/docs/pricing (openai.com/api/pricing
  # answers 403 to non-browser fetches; platform.openai.com/docs/pricing 301s
  # to the developers site). Standard tier, short context (<=272K input
  # tokens): Input $10.00 / Cached input $1.00 / Cache writes $12.50 /
  # Output $50.00 per 1M. The long-context tier (>272K input tokens:
  # $20 / $2 / $25 / $75) is not modelled. Unlike the GPT-5 rows, OpenAI
  # publishes a cache-WRITE rate here; the page's tooltip: "Input tokens are
  # either Input, Cached Input, or Cache Write and writes are not an additive
  # fee" — a token written to the cache is billed at the write rate instead of
  # the input rate, which is exactly how runner.pricing partitions input vs
  # cache_creation tokens. The page also lists a "Fast mode" (priority) tier
  # at 2x these rates; the codex-cli harness pins no service tier, so a run
  # is assumed to be standard tier. Used by the codex-cli harness
  # (subscription auth; cost_usd is a computed figure).
  gpt-6-astra:
    input: 10.00
    output: 50.00
    cache_write: 12.50
    cache_read: 1.00

  # --- xAI Grok — published rates as of 2026-05. No prompt-cache concept in
  # the public pricing, so both cache fields are null (=> 0 contribution).

  grok-4:
    input: 3.00
    output: 15.00
    cache_write: null
    cache_read: null
